name: ZedLink
options:
  bundleIdPrefix: dev.zedlink
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  ZedLink:
    type: application
    platform: iOS
    sources:
      - ZedLink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zedlink.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ZedLink
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
