name: ZedLink
options:
  bundleIdPrefix: dev.zedlink
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  ZedLink:
    type: application
    platform: iOS
    sources:
      - ZedLink
    scheme:
      testTargets:
        - ZedLinkTests
        - ZedLinkUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zedlink.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ZedLink
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the ZedLink pairing QR shown on your workstation.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  ZedLinkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ZedLinkUITests
    dependencies:
      - target: ZedLink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zedlink.app.uitests
        GENERATE_INFOPLIST_FILE: YES
  ZedLinkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ZedLinkTests
    dependencies:
      - target: ZedLink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zedlink.app.tests
        GENERATE_INFOPLIST_FILE: YES
