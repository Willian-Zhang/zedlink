name: macOS smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test protocol core
        run: cargo test --manifest-path protocol-core/Cargo.toml --locked
      - name: Check gateway
        run: cargo check --manifest-path gateway/Cargo.toml --locked
