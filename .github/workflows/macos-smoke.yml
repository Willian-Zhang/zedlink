name: macOS smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test protocol core
        run: cargo test --manifest-path protocol-core/Cargo.toml --locked
      - name: Check gateway
        run: cargo check --manifest-path gateway/Cargo.toml --locked
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate iOS project
        run: cd ios && xcodegen generate
      - name: Build iPhone simulator app
        run: >-
          xcodebuild -project ios/ZedLink.xcodeproj -scheme ZedLink
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/zedlink-derived CODE_SIGNING_ALLOWED=NO build
      - name: Verify launch screen declaration
        run: plutil -extract UILaunchScreen json -o - /tmp/zedlink-derived/Build/Products/Debug-iphonesimulator/ZedLink.app/Info.plist
      - name: Launch on iPhone simulator
        run: |
          device_id="$(xcrun simctl list -j devices available | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for devices in d["devices"].values() for x in devices if "iPhone" in x["name"] and x["state"] == "Shutdown"), ""))')"
          test -n "$device_id"
          printf '%s' "$device_id" > /tmp/zedlink-sim-device-id
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" /tmp/zedlink-derived/Build/Products/Debug-iphonesimulator/ZedLink.app
          xcrun simctl launch "$device_id" dev.zedlink.app
          sleep 3
          xcrun simctl io "$device_id" screenshot /tmp/zedlink-simulator.png
      - name: Test first-use navigation
        run: |
          device_id="$(cat /tmp/zedlink-sim-device-id)"
          xcodebuild -project ios/ZedLink.xcodeproj -scheme ZedLink \
            -configuration Debug -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath /tmp/zedlink-derived -parallel-testing-enabled NO \
            -only-testing:ZedLinkUITests/OnboardingUITests \
            CODE_SIGNING_ALLOWED=NO test
      - name: Save simulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: zedlink-simulator-launch
          path: /tmp/zedlink-simulator.png
