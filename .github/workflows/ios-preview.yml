name: iOS build and Sessions preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate iOS project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Boot isolated simulator
        run: |
          device_id="$(xcrun simctl list -j devices available | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if "iPhone" in x["name"] and x["state"] == "Shutdown"))')"
          echo "ZEDLINK_PREVIEW_DEVICE=$device_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
      - name: Compile and test iOS
        run: |
          xcodebuild -project ios/ZedLink.xcodeproj -scheme ZedLink \
            -configuration Debug -destination "platform=iOS Simulator,id=$ZEDLINK_PREVIEW_DEVICE" \
            -derivedDataPath /tmp/zedlink-preview-derived -resultBundlePath /tmp/zedlink-preview-tests.xcresult \
            -parallel-testing-enabled NO -only-testing:ZedLinkTests \
            -only-testing:ZedLinkUITests/SessionsPreviewUITests CODE_SIGNING_ALLOWED=NO test
      - name: Capture dark and light Sessions previews
        run: |
          mkdir -p /tmp/zedlink-preview
          xcrun simctl status_bar "$ZEDLINK_PREVIEW_DEVICE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          for theme in dark light; do
            xcrun simctl terminate "$ZEDLINK_PREVIEW_DEVICE" dev.zedlink.app || true
            xcrun simctl launch "$ZEDLINK_PREVIEW_DEVICE" dev.zedlink.app --zedlink-demo -zedlink.appearance "$theme"
            sleep 3
            xcrun simctl io "$ZEDLINK_PREVIEW_DEVICE" screenshot "/tmp/zedlink-preview/sessions-$theme.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zedlink-ios-sessions-preview
          path: |
            /tmp/zedlink-preview/*.png
            /tmp/zedlink-preview-tests.xcresult
          retention-days: 7
