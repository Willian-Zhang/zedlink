name: Android smoke

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Show Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          echo "ANDROID_HOME=$ANDROID_HOME"
      - name: Unit test and build debug APK
        run: gradle -p android --no-daemon testDebugUnitTest assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: zedlink-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
