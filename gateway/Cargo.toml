[package]
name = "zedlink-gateway"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", features = ["ws", "json"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.22"
futures-util = "0.3"
hex = "0.4"
isahc = "1.8"
jwt-simple = { version = "0.12", default-features = false, features = ["pure-rust"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
web-push = "0.11"
